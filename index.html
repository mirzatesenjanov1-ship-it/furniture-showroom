<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эмерек Салону</title>
  <link rel="icon" href="data:image/x-icon;base64,="> <!-- Favicon 404 катасын жок кылат -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.5rem;
      color: #f59e0b;
    }
    .admin-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border: 1px solid #334155;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .admin-link:hover {
      color: #ffffff;
      border-color: #f59e0b;
    }
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
    }
    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #334155;
      padding-bottom: 0.5rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #334155;
    }
    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }
    .card-price {
      font-size: 1.1rem;
      color: #f59e0b;
      font-weight: bold;
      margin-top: auto;
    }
    footer {
      background-color: #1e293b;
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>Эмерек Салону</h1>
    <a href="./#/admin" class="admin-link">Администратордук кирүү</a>
  </header>

  <main>
    <h2 class="section-title">Витрина</h2>
    <div id="product-list" class="product-grid">
      <!-- Статикалык витрина - JS иштебей калса да экран кара болбойт -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=500" alt="Люкс Диван">
        <div class="card-content">
          <div class="card-title">Люкс Диван</div>
          <div class="card-price">55,000 сом</div>
        </div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1530018607912-eff2daa1bac4?w=500" alt="Жыгач Үстөл">
        <div class="card-content">
          <div class="card-title">Ашкана Үстөлү</div>
          <div class="card-price">22,000 сом</div>
        </div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1580481072645-022f9a6d1270?w=500" alt="Кресло">
        <div class="card-content">
          <div class="card-title">Жумшак Кресло</div>
          <div class="card-price">15,000 сом</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Эмерек Салону. Бардык укуктар корголгон.
  </footer>

  <!-- Салыштырмалуу жол (relative path) колдонулат -->
  <script src="./js/app.js"></script>
</body>
</html>
